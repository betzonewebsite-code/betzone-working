# Local development only. Production should use managed Postgres and Redis with backups.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: betzone
      POSTGRES_PASSWORD: betzone_dev_pw
      POSTGRES_DB: betzone
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betzone"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    # BullMQ requires noeviction so queued jobs are never dropped.
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
volumes:
  pgdata:
  redisdata:

